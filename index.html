<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>V Rising Server Monitor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>V Rising Server Monitor</h1>

    <div class="status">
      <span id="indicator" class="indicator offline"></span>
      <span id="status-text">Offline</span>
    </div>

    <div class="players">
      Players online: <span id="playerCount">0</span>
    </div>

    <div class="server-info">
      <h2>Server Information</h2>
      <div id="server-info-content">Loading...</div>
    </div>
    
    <div class="uptime">
      <h2>Server Uptime</h2>
      <div id="uptime-content">Loading...</div>
    </div>

    <div class="broadcast-form">
      <h2>Broadcast Message</h2>
      <form id="broadcast-form">
        <input type="text" id="broadcast-message" placeholder="Enter message to broadcast" required>
        <button type="submit">Send</button>
      </form>
      <div id="broadcast-status"></div>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
