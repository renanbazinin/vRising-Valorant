<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="V_logo_noir.png" type="image/png">


  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>V Rising Monitor (Vanilla API)</title>
  <link rel="stylesheet" href="style.css"/>

  <!-- preview description -->
  <meta name="description" content="Stay on top of your V Rising server in style—live stats, chat blasts, save & shutdown controls, all in a sleek dashboard by aravimBevalorant.">

  <!-- Open Graph for link previews -->
  <meta property="og:title" content="V Rising Monitor by aravimBevalorant">
  <meta property="og:description" content="Experience real‑time V Rising server insights with aravimBevalorant’s cool dashboard: live players, uptime, world time, clan count, and remote controls.">
  <meta property="og:type" content="website">

</head>
<body>
  <div class="container">
    <h1>V Rising Server</h1>
    <div class="status">
      <span id="indicator" class="indicator offline"></span>
      <span id="status-text">Offline</span>
    </div>
    <div class="players">
      Players online: <span id="playerCount">0</span>
    </div>
    <div class="broadcast-form">
      <h2>Broadcast</h2>
      <form id="broadcast-form">
        <input id="broadcast-message" placeholder="Message…" required />
        <button type="submit">Send</button>
      </form>
      <div id="broadcast-status"></div>
    </div>

    <!-- metrics section required by client.js -->
    <div class="server-stats">
      <div>Uptime:      <span id="uptime-content">–</span></div>
      <div>Day:         <span id="day-content">–</span></div>
      <div>FPS:         <span id="fps-content">–</span></div>
      <div>World Time:  <span id="worldTime-content">–</span></div>
      <div>Clan Count:  <span id="clanCount-content">–</span></div>
    </div>
    <p>
      Last update: <span id="last-update">–</span><br>
      Next fetch:  <span id="next-fetch">–</span>
    </p>
    </div>
  <script src="client.js"></script>
</body>
</html>
