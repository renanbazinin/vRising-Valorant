<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>V Rising Monitor (Vanilla API)</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1>V Rising Server</h1>
    <div class="status">
      <span id="indicator" class="indicator offline"></span>
      <span id="status-text">Offline</span>
    </div>
    <div class="players">
      Players online: <span id="playerCount">0</span>
    </div>
    <div class="broadcast-form">
      <h2>Broadcast</h2>
      <form id="broadcast-form">
        <input id="broadcast-message" placeholder="Message…" required />
        <button type="submit">Send</button>
      </form>
      <div id="broadcast-status"></div>
    </div>
  </div>
  <script src="client.js"></script>
</body>
</html>
